button{font:inherit;cursor:pointer;border:0}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tb{border-radius:16px;padding:22px 10px;font-weight:700;font-size:20px;display:flex;flex-direction:column;align-items:center}

.tmr{text-align:center;font:700 56px/1.2 "Tajawal",sans-serif;margin:14px 0 4px}

.row{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.b2,.ac{border-radius:12px;padding:9px 16px;font-weight:700;background:var(--ln);color:var(--ink)}

.ac{background:var(--gr);color:var(--gk);padding:12px 6px;font-size:16px}

.ol{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}

.rk div{display:flex;justify-content:space-between;border-radius:12px;padding:12px 16px;font-weight:700;font-size:19px}
.big{text-align:center;font:700 38px/1.4 "Amiri",serif;padding:14px;border-radius:16px;margin:8px 0}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}

body,button,input,textarea,select{font-family:"Handicrafts","Cairo",system-ui,sans-serif}
h2,header h1,.hc b,.big,.win,.tmr,.n,.qn,.tb,.tb b,.rt h3,.qt,.ol li,.ol i,.a div,.tab,.er .nm,.er .em,.ed input,.card input[type=number]{font-family:"Handicrafts","Cairo",system-ui,sans-serif}
header h1{font-weight:900}h2,.hc b,.rt h3,.big,.win,.tmr,.n,.qn,.tb,.tb b{font-weight:700}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body{overflow-x:hidden}main,.card,.ed,.hc{min-width:0}textarea,input{max-width:100%}
@media(max-width:699px){.hm{grid-template-columns:1fr}}
@media(max-width:480px){body{font-size:16px}header{padding:12px 12px 16px;border-radius:0 0 26px 26px}.logos{padding:6px 14px;gap:12px}.logos img{height:50px}.logos img+img{padding-right:12px}header h1{font-size:30px}h2{font-size:24px}main{padding:12px 12px 36px}.tg{grid-template-columns:repeat(3,1fr)}.tb{font-size:13px;padding:8px 3px}.tb b{font-size:18px;padding:0 10px}.qg{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:9px}.qn{font-size:22px}.tmr{font-size:62px}.qt{font-size:21px}.ol li{font-size:18px}.acs{gap:6px}.ac{font-size:14px;padding:12px 4px}.bar{font-size:16px;padding:9px 12px}.card{padding:16px;border-radius:22px}.hc{padding:16px}.hc .ic{font-size:38px}.hc b{font-size:26px}.win{font-size:34px}}
@media(max-width:360px){.logos img{height:42px}header h1{font-size:26px}.qg{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}.tmr{font-size:54px}}
@media(min-width:481px) and (max-width:1023px){body{font-size:18px}main{max-width:820px}.qg{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.qn{font-size:28px}.tmr{font-size:84px}.qt{font-size:26px}.ol li{font-size:21px}}
@media(min-width:900px),(max-height:500px) and (orientation:landscape){header{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:12px 24px;border-radius:0 0 28px 28px}header .logos{margin:0}header h1{margin:0;font-size:42px}#hm{margin:0}}
@media(max-height:500px) and (orientation:landscape){.logos img{height:38px}header h1{font-size:24px}.tmr{font-size:48px}main{padding-top:8px}}
@media(min-width:1000px){main{max-width:1060px}.hm{grid-template-columns:repeat(4,1fr)}.tg{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.rt ul{grid-template-columns:repeat(3,1fr)}.qg{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}.card:has(>.qh){display:grid;grid-template-columns:1fr 1.1fr;column-gap:28px;align-items:start}.card:has(>.qh)>.qh,.card:has(>.qh)>.tmr,.card:has(>.qh)>.row,.card:has(>.qh)>.acs{grid-column:1}.card:has(>.qh)>.ol,.card:has(>.qh)>.msg,.card:has(>.qh)>.lk{grid-column:2}.card:has(>.qh)>.ol{grid-row:1/span 4;margin-top:0}}
@media(min-width:1440px){html{zoom:1.2}:focus-visible,button:focus-visible{outline:4px solid var(--gd);outline-offset:3px}}
@media(min-width:1920px){html{zoom:1.6}}
@media(min-width:2560px){html{zoom:2.1}}
@media(min-width:3200px){html{zoom:2.7}}
header{position:relative}#gs{position:absolute;left:12px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:17px;line-height:1;display:grid;place-items:center}#gs[hidden]{display:none}
.hc .ic{font-size:26px}.hc{padding:14px 18px}.hc b{font-size:24px}.hc small{font-size:14px}header h1::before{font-size:.7em}
@media(min-width:700px){.hm{grid-template-columns:repeat(3,1fr)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.07)}100%{transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes okp{0%{transform:scale(.95)}50%{transform:scale(1.05)}100%{transform:none}}
@keyframes blink{50%{opacity:.4}}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
@keyframes flt{50%{transform:translateY(-4px)}}
@keyframes spin{from{opacity:0;transform:rotate(-200deg) scale(0)}to{opacity:1;transform:none}}
@keyframes drop{from{transform:translateY(-100%)}to{transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.2),transparent 55%),linear-gradient(135deg,#a3323b,#c1444c 55%,#e2824a);animation:spOut .6s ease 1.8s forwards}
#sp .logos{margin:0;padding:14px 26px;border-radius:28px;animation:pop .9s cubic-bezier(.2,1.3,.4,1) backwards}
#sp .logos img{height:84px}
#sp b{font-size:36px;font-weight:900;animation:rise .7s ease .5s backwards}
#sp b::before{content:"🏆 "}
#app.enter>h2,#app.enter>.bar,#app.enter>.card,#app.enter>.tabs,#app.enter>.rt,#app.enter>.hm+.msg{animation:rise .45s ease backwards}
#app.enter .hc,#app.enter .tb,#app.enter .big{animation:pop .55s cubic-bezier(.2,1.3,.4,1) backwards}
#app.enter .hc:nth-child(2),#app.enter .tb:nth-child(2){animation-delay:.08s}#app.enter .hc:nth-child(3),#app.enter .tb:nth-child(3){animation-delay:.16s}#app.enter .tb:nth-child(4){animation-delay:.24s}#app.enter .tb:nth-child(5){animation-delay:.32s}#app.enter .tb:nth-child(6){animation-delay:.4s}#app.enter .tb:nth-child(n+7){animation-delay:.48s}
#app.enter .qn{animation:pop .4s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i,0)*22ms + .2s)}
#app.enter .rk div{animation:slide .5s ease backwards}#app.enter .rk div:nth-child(2){animation-delay:.1s}#app.enter .rk div:nth-child(3){animation-delay:.2s}#app.enter .rk div:nth-child(4){animation-delay:.3s}#app.enter .rk div:nth-child(5){animation-delay:.4s}#app.enter .rk div:nth-child(n+6){animation-delay:.5s}
.ol.ofx li{animation:slide .4s ease backwards}.ol.ofx li:nth-child(2){animation-delay:.09s}.ol.ofx li:nth-child(3){animation-delay:.18s}.ol.ofx li:nth-child(4){animation-delay:.27s}
.ol li.c{animation:okp .6s ease}.ol li.x{animation:shake .5s ease}
.tmr.z{animation:blink 1s ease-in-out infinite}
.win{animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
.hc .ic{display:inline-block;animation:flt 3s ease-in-out infinite}.hc:nth-child(2) .ic{animation-delay:.5s}.hc:nth-child(3) .ic{animation-delay:1s}.hc:hover .ic{animation:wig .6s ease}
#gs{transition:transform .4s ease}#gs:hover{transform:rotate(90deg)}#gs:active{transform:rotate(180deg) scale(.9)}
body.fl header{animation:drop .8s cubic-bezier(.2,1,.3,1) 1.5s backwards}body.fl #gs{animation:spin .8s ease 2s backwards}body.fl #app.enter>h2{animation-delay:1.7s}body.fl #app.enter .hc{animation-delay:1.8s}body.fl #app.enter .hc:nth-child(2){animation-delay:1.95s}body.fl #app.enter .hc:nth-child(3){animation-delay:2.1s}

#app.fade{animation:fadein .2s ease}
.win{animation:none}.win.pw{animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
#gs:active{transform:rotate(90deg)}

.lg{margin:0;line-height:0}.lg::before{content:none!important}.lg img{height:96px;width:auto;max-width:88vw;display:block;margin:0 auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#sp .slw{line-height:0;animation:rise .7s ease .5s backwards}#sp .slw img{height:170px;max-width:86vw;width:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}

var A=["﴿وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ﴾","﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ…﴾","﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ…﴾","﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا﴾","﴿وَأَوْفُوا بِالْعَهْدِ…﴾","﴿وَقُولُوا لِلنَّاسِ حُسْنًا…﴾","﴿وَلَا تَقْرَبُوا الزِّنَا…﴾","﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾"];
var Q=[
["من ربك؟","ربي الله الذي رباني وربى جميع العالمين بنعمته.",["ربي الشمس والقمر","ربي أبي وأمي اللذان ربياني","ربي الملائكة المقربون"]],
["ما الدليل على أن ربي الله؟","قوله تعالى: ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾.",[0,1,2]],
["ما دينك؟","ديني الإسلام، وهو الاستسلام لله بالتوحيد، والانقياد له بالطاعة، والبراءة من الشرك وأهله.",["ديني ما يحبه أهلي وأصحابي، وأفعل ما يعجبني","ديني الإسلام، وهو الصلاة فقط دون غيرها من الأعمال","ديني الإسلام، وهو الكلام الطيب مع الناس فقط"]],
["ما الدليل على أن ديني الإسلام؟","قال تعالى: ﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ…﴾.",[3,4,5]],
["من نبيك؟","محمد ﷺ.",["أبو بكر الصديق رضي الله عنه","جبريل عليه السلام","عمر بن الخطاب رضي الله عنه"]],
["ما الدليل على أن نبيي محمد ﷺ؟","قال تعالى: ﴿مُحَمَّدٌ رَسُولُ اللَّهِ…﴾.",[6,7,0]],
["لماذا خلقنا الله تعالى؟","خلقنا لعبادته وحده لا شريك له، لا للهو واللعب.",["خلقنا للهو واللعب والمرح","خلقنا لنجمع المال والأملاك","خلقنا لنأكل ونشرب فقط"]],
["ما الدليل على أن الله خلقنا لعبادته؟","قال تعالى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾.",[1,3,5]],
["ما هي العبادة؟","اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة.",["اسم لأداء الصلاة في المسجد فقط","اسم لما يفعله الإنسان في وقت فراغه","اسم لأعمال الجسد الظاهرة دون القلب"]],
["ما العبادة الظاهرة؟ اذكر مثالًا لها.","مثل ذكر الله باللسان من التسبيح والتحميد والتكبير.",["مثل التوكل على الله","مثل الخوف من الله","مثل الرجاء في رحمة الله"]],
["ما العبادة الباطنة؟ اذكر أمثلة لها.","مثل التوكل والخوف والرجاء.",["مثل التسبيح والتحميد والتكبير باللسان","مثل الركوع والسجود في الصلاة","مثل الصيام والحج"]],
["ما أعظم واجب علينا؟","أعظم واجب علينا توحيد الله تعالى.",["الاجتهاد في جمع المال","الفوز في المسابقات","الإكثار من اللعب والترفيه"]],
["اذكر كلمة التوحيد.","«لا إله إلا الله».",["«سبحان الله وبحمده»","«الله أكبر كبيرًا»","«الحمد لله رب العالمين»"]],
["ما معنى كلمة التوحيد؟","لا معبود حق إلا الله.",["لا معبود موجود إلا الله","لا خالق ولا رازق إلا الله","لا حاكم في الأرض إلا الله"]],
["ما الدليل على كلمة التوحيد؟","قال تعالى: ﴿فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ…﴾.",[2,4,6]],
["ما معنى شهادة أن محمدًا رسول الله ﷺ؟","معناها أن الله أرسله للعالمين بشيرًا ونذيرًا.",["أنه ملك من الملائكة نزل من السماء","أنه يعلم الغيب ويضر وينفع","أنه أرسل إلى قومه من العرب فقط"]],
["ما الدليل على شهادة أن محمدًا رسول الله ﷺ؟","قال تعالى: ﴿لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِّمَن كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا﴾.",[7,0,3]],
["أين الله عز وجل؟","الله في السماء فوق العرش، فوق جميع المخلوقات.",["الله في كل مكان بذاته","الله داخل قلوب الناس","الله تحت الأرض"]],
